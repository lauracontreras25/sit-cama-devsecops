name: SIT-Cama DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

jobs:
  # 1. ESCANEO DE SECRETOS
  secret-scan:
    name: 1. Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. PRUEBAS, SAST Y SCA
  build-and-static-security:
    name: 2. Pruebas, SAST (Semgrep) & SCA (Trivy)
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # CAMBIO A: Node 26 en lugar de 20 (Node 20 sin soporte desde el 30-abr-2026)
          node-version: 26
          cache: 'npm'
      - run: npm ci
      - run: npm run test:coverage --if-present
      - name: SAST con Semgrep (Detección OWASP & PII)
        # CAMBIO B: se agrega el conjunto de reglas p/expressjs a --config auto
        run: |
          python3 -m pip install semgrep
          semgrep scan --config auto --config p/expressjs --error --severity ERROR
      - name: SCA de Dependencias con Trivy
        # CAMBIO C: acción fijada a un commit (v0.35.0) en lugar de @master, por el incidente de seguridad de marzo de 2026
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  # 3. CONSTRUCCIÓN, ESCANEO Y FIRMA DE IMAGEN
  package-and-sign:
    name: 3. Build Contenedor, Escaneo & Firma Cosign
    needs: build-and-static-security
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ghcr.io/${{ github.repository }}/sit-cama-backend:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_TAG }}
      - name: Escaneo de Vulnerabilidades en Imagen con Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          severity: 'CRITICAL'
          exit-code: '1'
          format: 'table'
      - uses: sigstore/cosign-installer@v3
      - name: Firmar Imagen Criptográficamente (Keyless OIDC)
        run: cosign sign --yes ${{ env.IMAGE_TAG }}

  # 4. DESPLIEGUE EN STAGING Y DAST
  dast-analysis:
    name: 4. Despliegue Efímero & DAST (OWASP ZAP)
    needs: package-and-sign
    # CAMBIO D: permiso issues: write solo para este job (ZAP crea un issue con el reporte)
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Levantar Contenedor de Pruebas en Staging
        run: |
          docker run -d --name sit-cama-staging -p 3000:3000 ghcr.io/${{ github.repository }}/sit-cama-backend:${{ github.sha }}
          sleep 5
      # CAMBIO E: action-baseline v0.15.0 (la v0.12.0 falla al subir artefactos) y sin rules_file_name (el archivo no existe en el repo)
      - uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:3000'
          cmd_options: '-a'
